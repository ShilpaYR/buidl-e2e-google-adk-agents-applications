# gcloud builds submit --config cloudbuild.yaml \
#   --substitutions=_REGION=us-central1,_SERVICE_NAME=gemini-cli-adk
substitutions:
  _REGION: us-central1
  _REPO_NAME: adk-agents
  _SERVICE_NAME: gemini-cli-adk
  _IMAGE_TAG: latest

steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:${_IMAGE_TAG}", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:${_IMAGE_TAG}"]
  - name: gcr.io/cloud-builders/gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:${_IMAGE_TAG}
      - --region=${_REGION}
      - --memory=2Gi
      - --cpu=2
      - --timeout=900
      - --no-allow-unauthenticated
      - --set-env-vars=GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=global,GOOGLE_GENAI_USE_VERTEXAI=true

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:${_IMAGE_TAG}
