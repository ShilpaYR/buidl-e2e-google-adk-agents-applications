# MCP Toolbox for Databases — LOCAL mode (plain PostgreSQL, keyword search).
# Start:  toolbox --tools-file mcp-toolbox/tools.local.yaml --port 5000
# Passwords come from the environment, never from this file.
sources:
  tickets-db:
    kind: postgres
    host: ${DB_HOST:127.0.0.1}
    port: ${DB_PORT:5432}
    database: ticketsdb
    user: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}

tools:
  search-tickets:
    kind: postgres-sql
    source: tickets-db
    description: >
      Search for similar or duplicate tickets by meaning of their title/description.
      Returns up to 3 tickets ordered by relevance (higher = more similar).
    parameters:
      - name: query
        type: string
        description: Natural-language description of the problem.
    statement: |
      SELECT ticket_id, title, description, assignee, priority, status,
             round(ts_rank(to_tsvector('english', title || ' ' || COALESCE(description, '')), q)::numeric, 4) AS relevance
      FROM tickets,
           to_tsquery('english', NULLIF(replace(plainto_tsquery('english', $1)::text, ' & ', ' | '), '')) AS q
      WHERE to_tsvector('english', title || ' ' || COALESCE(description, '')) @@ q
      ORDER BY relevance DESC
      LIMIT 3;

  get-ticket-by-id:
    kind: postgres-sql
    source: tickets-db
    description: Retrieve a ticket's details using its unique numeric ID.
    parameters:
      - name: ticket_id
        type: integer
        description: The unique ID of the ticket.
    statement: SELECT * FROM tickets WHERE ticket_id = $1;

  get-tickets-by-assignee:
    kind: postgres-sql
    source: tickets-db
    description: List tickets assigned to a person (matches part of the email address).
    parameters:
      - name: assignee
        type: string
        description: Email (or part of it) of the assignee.
    statement: SELECT * FROM tickets WHERE assignee ILIKE '%' || $1 || '%' ORDER BY priority, creation_time DESC;

  get-tickets-by-status:
    kind: postgres-sql
    source: tickets-db
    description: List tickets with a given status ('Open', 'In Progress', 'Closed', 'Resolved').
    parameters:
      - name: status
        type: string
        description: Ticket status.
    statement: SELECT * FROM tickets WHERE status ILIKE $1 ORDER BY priority, creation_time DESC;

  get-tickets-by-priority:
    kind: postgres-sql
    source: tickets-db
    description: List tickets with a given priority ('P0 - Critical', 'P1 - High', 'P2 - Medium', 'P3 - Low').
    parameters:
      - name: priority
        type: string
        description: Ticket priority, e.g. 'P0 - Critical'.
    statement: SELECT * FROM tickets WHERE priority ILIKE '%' || $1 || '%' ORDER BY creation_time DESC;

  get-tickets-by-date-range:
    kind: postgres-sql
    source: tickets-db
    description: Tickets created or updated between two dates (inclusive, YYYY-MM-DD).
    parameters:
      - name: start_date
        type: string
        description: Start date, YYYY-MM-DD.
      - name: end_date
        type: string
        description: End date, YYYY-MM-DD.
      - name: date_field
        type: string
        description: Which date to filter on, 'creation_time' or 'updated_time'.
    statement: |
      SELECT * FROM tickets
      WHERE CASE WHEN $3 = 'updated_time' THEN updated_time ELSE creation_time END
            BETWEEN $1::date AND ($2::date + INTERVAL '1 day')
      ORDER BY creation_time DESC;

  update-ticket-priority:
    kind: postgres-sql
    source: tickets-db
    description: Change a ticket's priority ('P0 - Critical', 'P1 - High', 'P2 - Medium', 'P3 - Low').
    parameters:
      - name: priority
        type: string
        description: New priority.
      - name: ticket_id
        type: integer
        description: Ticket ID.
    statement: UPDATE tickets SET priority = $1 WHERE ticket_id = $2 RETURNING ticket_id, title, priority;

  update-ticket-status:
    kind: postgres-sql
    source: tickets-db
    description: Change a ticket's status ('Open', 'In Progress', 'Closed', 'Resolved').
    parameters:
      - name: status
        type: string
        description: New status.
      - name: ticket_id
        type: integer
        description: Ticket ID.
    statement: UPDATE tickets SET status = $1 WHERE ticket_id = $2 RETURNING ticket_id, title, status;

  create-new-ticket:
    kind: postgres-sql
    source: tickets-db
    description: Create a new bug ticket. Returns the new ticket_id.
    parameters:
      - name: title
        type: string
        description: Short title.
      - name: description
        type: string
        description: Detailed description (different from the title).
      - name: assignee
        type: string
        description: Assignee email, or empty string if unassigned.
        default: ""
      - name: priority
        type: string
        description: "'P0 - Critical', 'P1 - High', 'P2 - Medium' or 'P3 - Low'."
        default: P3 - Low
      - name: status
        type: string
        description: Initial status, normally 'Open'.
        default: Open
    statement: |
      INSERT INTO tickets (title, description, assignee, priority, status)
      VALUES ($1, $2, NULLIF($3, ''), $4, $5)
      RETURNING ticket_id, title, priority, status;

toolsets:
  tickets_toolset:          # full access (triage leads)
    - search-tickets
    - get-ticket-by-id
    - get-tickets-by-assignee
    - get-tickets-by-status
    - get-tickets-by-priority
    - get-tickets-by-date-range
    - update-ticket-priority
    - update-ticket-status
    - create-new-ticket
  tickets_readonly:         # least privilege option (TOOLBOX_TOOLSET=tickets_readonly)
    - search-tickets
    - get-ticket-by-id
    - get-tickets-by-assignee
    - get-tickets-by-status
    - get-tickets-by-priority
    - get-tickets-by-date-range
